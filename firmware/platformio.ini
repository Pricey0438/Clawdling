[env:waveshare_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
; Custom partition table — bumps NVS from default 20KB to 64KB.
; See partitions_clawdmeter_8mb.csv for the layout rationale.
board_build.partitions = partitions_clawdmeter_8mb.csv
upload_speed = 921600
monitor_speed = 115200
extra_scripts =
    pre:scripts/fw_version.py
    pre:scripts/gen_balance_h.py

; Compile shared code + this board's per-board folder; exclude all other
; boards. New ports add a `+<boards/<name>/>` line in their own env block.
build_src_filter =
    +<*>
    -<boards/>
    +<boards/waveshare_amoled_216/>

build_flags =
    -DBOARD_AMOLED_216
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; Expose this board's board.h to shared code so board_self_id.cpp can
    ; read BOARD_HAS_IO_EXPANDER at compile time (it runs before board_init
    ; so BoardCaps isn't populated yet). Don't lean on this in other shared
    ; files — capability checks belong in BoardCaps (runtime).
    -I${PROJECT_SRC_DIR}/boards/waveshare_amoled_216
    ; AXP2101 PMU
    -DXPOWERS_CHIP_AXP2101
    ; NimBLE config — peripheral, 2 simultaneous connections so the OS can
    ; hold the HID link (Space key from BOOT button) while the daemon holds
    ; its own connection for the custom data service.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1
    -DLV_USE_TEXTAREA=1
    -DLV_USE_KEYBOARD=1
    -DLV_USE_BUTTONMATRIX=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_USE_SWITCH=1
    ; LVGL allocator: use libc malloc so allocations transparently spill to
    ; PSRAM when internal heap is full. Default LV_STDLIB_BUILTIN ships a
    ; 64 KB static pool in .dram0.bss which fills at ~91% just from the
    ; eagerly-built screen widget trees, leaving achievements_screen_init
    ; (~20 KB widget tree) with too little headroom — the malloc fails and
    ; LV_USE_ASSERT_MALLOC's while(1) hangs the LVGL task forever (the
    ; symptom that caused multi-session screenshot-capture wedges; see the
    ; screenshot-capture-wedge memory). Bumping the static pool wasn't an
    ; option — 128 KB starved BLE_INIT's malloc (DRAM exhaustion).
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1
    ricmoo/QRCode@^0.0.1


[env:waveshare_amoled_18]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Custom partition table — bumps NVS from default 20KB to 64KB.
; See partitions_clawdmeter_16mb.csv for the layout rationale.
board_build.partitions = partitions_clawdmeter_16mb.csv
upload_speed = 921600
monitor_speed = 115200
extra_scripts =
    pre:scripts/fw_version.py
    pre:scripts/gen_balance_h.py

; Compile shared code + this board's per-board folder; exclude all other
; boards. New ports add a `+<boards/<name>/>` line in their own env block.
build_src_filter =
    +<*>
    -<boards/>
    +<boards/waveshare_amoled_18/>

build_flags =
    -DBOARD_AMOLED_18
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; See the 216 env block for why this -I exists. Same rationale: lets
    ; board_self_id.cpp read BOARD_HAS_IO_EXPANDER before BoardCaps is up.
    -I${PROJECT_SRC_DIR}/boards/waveshare_amoled_18
    ; AXP2101 PMU is present on the AMOLED-1.8 board too (battery is optional kit add-on)
    -DXPOWERS_CHIP_AXP2101
    ; NimBLE config — peripheral, 2 simultaneous connections so the OS can
    ; hold the HID link (Space key from BOOT button) while the daemon holds
    ; its own connection for the custom data service.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1
    -DLV_USE_TEXTAREA=1
    -DLV_USE_KEYBOARD=1
    -DLV_USE_BUTTONMATRIX=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_USE_SWITCH=1
    ; LVGL allocator: use libc malloc so allocations transparently spill to
    ; PSRAM when internal heap is full. Default LV_STDLIB_BUILTIN ships a
    ; 64 KB static pool in .dram0.bss which fills at ~91% just from the
    ; eagerly-built screen widget trees, leaving achievements_screen_init
    ; (~20 KB widget tree) with too little headroom — the malloc fails and
    ; LV_USE_ASSERT_MALLOC's while(1) hangs the LVGL task forever (the
    ; symptom that caused multi-session screenshot-capture wedges; see the
    ; screenshot-capture-wedge memory). Bumping the static pool wasn't an
    ; option — 128 KB starved BLE_INIT's malloc (DRAM exhaustion).
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB

lib_deps =
    ; 1.6.4+ ships Arduino_SH8601 in mainline
    moononournation/GFX Library for Arduino@^1.6.4
    ; SensorLib still used for QMI8658 IMU on AMOLED-1.8
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1
    ricmoo/QRCode@^0.0.1
